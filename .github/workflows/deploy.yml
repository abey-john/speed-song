name: Deploy Speed Song to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Refresh data weekly (Sunday midnight UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Speed Song
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Only run the data pipeline on scheduled or manual runs, and only if Spotify secrets are provided
      - name: Build Spotify & Apple data pipeline
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.SPOTIFY_CLIENT_ID != ''
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          INCLUDE_FOLLOWED: ${{ secrets.INCLUDE_FOLLOWED || 'false' }}
        run: |
          npm run data:build
          npm run data:check

      - name: Commit updated playlist data
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.SPOTIFY_CLIENT_ID != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh spotify playlists and audio previews [skip ci]"
            git push
          fi

      - name: Build frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
